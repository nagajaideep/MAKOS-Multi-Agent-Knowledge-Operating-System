[project]
name = "makos"
version = "0.1.0"
description = "MAKOS: a context-aware, evidence-grounded multi-agent framework for enterprise workflow automation"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
markers = ["postgres: needs a PostgreSQL database (set MAKOS_TEST_DATABASE_URL)"]
